[package]
name = "lagscope-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "The shared engine of LagScope and LagScope Pulse: analysis rules, scoring, design tokens and the test protocol."
repository = "https://github.com/sevencooper/lagscope-core"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
